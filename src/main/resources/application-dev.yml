# 개발용. 파일 기반 H2 라서 서버를 껐다 켜도 데이터가 남는다.
spring:
  datasource:
    url: jdbc:h2:file:./data/dongsa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
