# 서버 한 대에 전부 올리는 구성. 오라클 클라우드 무료 인스턴스나 아무 VPS 에서 그대로 돈다.
#
#   cp deploy/env.example .env   # 값 채우고
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
#
# caddy 가 도메인만 있으면 HTTPS 인증서를 알아서 받아 오고 갱신까지 한다.

name: dongsa

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dongsa}
      POSTGRES_USER: ${POSTGRES_USER:-dongsa}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 넣으세요}"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dongsa} -d ${POSTGRES_DB:-dongsa}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: ${DB_MEMORY:-1g}
    # 바깥에 포트를 열지 않는다. 앱 컨테이너에서만 닿는다.

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-dongsa}
      DATABASE_USER: ${POSTGRES_USER:-dongsa}
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET 를 .env 에 넣으세요 — openssl rand -base64 48}"
    # 작은 서버에서 JVM 이 메모리를 다 먹고 DB 를 굶기지 않게. 힙은 이 값의 75% 가 된다.
    mem_limit: ${APP_MEMORY:-1500m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: "${DOMAIN:?DOMAIN 을 .env 에 넣으세요 — 예를 들면 dongsa.example.com}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
